name: A12 iOS 14.7 Build Validation

on:
  push:
    branches:
      - "a12-performance-build-validation"
  workflow_dispatch:

concurrency:
  group: a12-ios14_7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios-arm64:
    name: Build iOS 14.7 ARM64 IPA
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Apple build dependencies
        shell: bash
        run: |
          set -euo pipefail

          retry() {
            local attempts=0
            until "$@"; do
              attempts=$((attempts + 1))
              if [ "$attempts" -ge 5 ]; then
                return 1
              fi
              sleep 5
            done
          }

          brew install ninja
          retry git submodule update --init --depth=1 --recursive -j"$(sysctl -n hw.ncpu)"
          retry git -C third_party/DirectXShaderCompiler submodule update --init --depth=1 \
            external/SPIRV-Headers external/SPIRV-Tools
          ./xenia-build.py fetchdata

      - name: Select Xcode 15.4
        shell: bash
        run: |
          set -euo pipefail
          test -d /Applications/Xcode_15.4.app
          sudo xcode-select -s /Applications/Xcode_15.4.app
          xcodebuild -version
          echo "iPhoneOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
          test "$(xcodebuild -version | awk 'NR == 1 { print $2 }')" = "15.4"

      - name: Prepare Xcode 15 compatible app icon
        shell: bash
        run: |
          set -euo pipefail

          # Xcode 15.4 predates Icon Composer .icon bundles. Build a minimal
          # legacy catalog containing only the primary AppIcon so it can coexist
          # with XeniOSAssets.xcassets without duplicate SettingsLink assets.
          compat_catalog="scratch/A12CompatAppIcon.xcassets"
          rm -rf "$compat_catalog"
          mkdir -p "$compat_catalog"
          cp assets/apple/AppIcon.xcassets/Contents.json "$compat_catalog/Contents.json"
          cp -R assets/apple/AppIcon.xcassets/AppIcon.appiconset "$compat_catalog/AppIcon.appiconset"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/xenia/app/CMakeLists.txt")
          text = path.read_text()

          replacements = {
              'set(_xe_ios_app_icon "${PROJECT_SOURCE_DIR}/assets/apple/AppIcon.icon")':
                  'set(_xe_ios_app_icon "${PROJECT_SOURCE_DIR}/scratch/A12CompatAppIcon.xcassets")',
              'XCODE_LAST_KNOWN_FILE_TYPE "folder.iconcomposer.icon"':
                  'XCODE_LAST_KNOWN_FILE_TYPE "folder.assetcatalog"',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"expected compatibility patch anchor missing: {old}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Patch DXC for Xcode 15.4 libc++
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("third_party/DirectXShaderCompiler/projects/dxilconv/lib/ShaderBinary/ShaderBinary.cpp")
          text = path.read_text()

          include_anchor = '#include "ShaderBinaryIncludes.h"'
          if '#include <algorithm>' not in text:
              if include_anchor not in text:
                  raise SystemExit("DXC compatibility include anchor missing")
              text = text.replace(include_anchor, include_anchor + '\\n#include <algorithm>', 1)

          replacements = {
              'switch( min( 4u, max( 1u, (UINT)(ReadTokenSafe(m_pCurrentToken)) ) ) )':
                  'switch( std::min( 4u, std::max( 1u, (UINT)(ReadTokenSafe(m_pCurrentToken)) ) ) )',
              'min(instruction.m_ExtendedOpCodeCount,(UINT)D3D11_SB_MAX_SIMULTANEOUS_EXTENDED_OPCODES)':
                  'std::min(instruction.m_ExtendedOpCodeCount,(UINT)D3D11_SB_MAX_SIMULTANEOUS_EXTENDED_OPCODES)',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"DXC compatibility patch anchor missing: {old}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Audit Xcode 15.4 and A12 compatibility
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          failures = []

          user_property = Path("src/xenia/kernel/xam/user_property.cc").read_text()
          if "static_cast<AttributeKey>(property_id)" in user_property:
              failures.append("user_property.cc still contains the Xcode 15-incompatible AttributeKey cast")

          memory_posix = Path("src/xenia/base/memory_posix.cc").read_text()
          apple_guard = """#if !XE_PLATFORM_APPLE
            // Apple libc++ in Xcode 15.4 exposes at_quick_exit as an unresolved using
            // declaration. Normal atexit cleanup is sufficient on Apple platforms.
            std::at_quick_exit(CleanupAtExit);
          #endif"""
          if apple_guard not in memory_posix:
              failures.append("memory_posix.cc Apple at_quick_exit guard is missing")

          logging = Path("src/xenia/base/logging.cc").read_text()
          if "std::quick_exit(EXIT_FAILURE)" in logging and "#elif XE_PLATFORM_APPLE" not in logging:
              failures.append("logging.cc still calls std::quick_exit on Apple/Xcode 15.4")
          if "std::_Exit(EXIT_FAILURE)" not in logging:
              failures.append("logging.cc is missing the Apple immediate-exit fallback")

          dxc = Path("third_party/DirectXShaderCompiler/projects/dxilconv/lib/ShaderBinary/ShaderBinary.cpp").read_text()
          if re.search(r"(?<![:\w])(?:min|max)\s*\(", dxc):
              failures.append("DXC ShaderBinary.cpp still contains unqualified min/max calls")

          ios_helpers = Path("src/xenia/ui/ios/shared/ios_view_helpers.mm").read_text()
          if "UIGlassEffect" in ios_helpers and (
              "__IPHONE_26_0" not in ios_helpers or
              "__IPHONE_OS_VERSION_MAX_ALLOWED >= __IPHONE_26_0" not in ios_helpers
          ):
              failures.append("iOS 26 glass APIs are not guarded for the Xcode 15.4 SDK")

          pipeline = Path("src/xenia/gpu/metal/metal_pipeline_cache.cc").read_text()
          if "IROperatingSystem_iOS" not in pipeline:
              failures.append("Metal Shader Converter is not configured with the iOS operating-system target")

          release_script = Path("tools/build_apple_release.sh").read_text()
          if 'CMAKE_OSX_DEPLOYMENT_TARGET="$ios_min"' not in release_script:
              failures.append("--ios-min does not drive CMake iOS configuration")
          if 'IPHONEOS_DEPLOYMENT_TARGET="$ios_min"' not in release_script:
              failures.append("--ios-min does not drive the Xcode build setting")

          root_cmake = Path("CMakeLists.txt").read_text()
          if "-Werror=unguarded-availability" not in root_cmake:
              failures.append("first-party iOS targets do not make unguarded SDK availability fatal")

          ios_entitlements = Path("xenia_ios.entitlements").read_text()
          if "com.apple.security.files.user-selected." in ios_entitlements:
              failures.append("iOS entitlements contain a macOS App Sandbox user-selected-files entitlement")

          app_delegate = Path("src/xenia/ui/ios/app/ios_app_delegate.mm").read_text()
          # Audit only the first-launch path. An earlier makeKeyAndVisible call
          # exists in the app_-already-initialized scene-replacement branch,
          # where persistent logging is necessarily already alive.
          new_app_anchor = app_delegate.find(
              "app_context_ = std::make_unique<xe::ui::IOSWindowedAppContext>();")
          logging_pos = app_delegate.find(
              "xe::InitializeLogging(app_->GetName())", new_app_anchor)
          view_controller_pos = app_delegate.find(
              "XeniaViewController* vc = [[XeniaViewController alloc] init];",
              new_app_anchor)
          orientation_pos = app_delegate.find(
              "xe_request_current_orientation(vc)", new_app_anchor)
          if new_app_anchor < 0 or logging_pos < 0:
              failures.append("iOS bootstrap no longer initializes persistent logging")
          elif ((view_controller_pos >= 0 and logging_pos > view_controller_pos) or
                (orientation_pos >= 0 and logging_pos > orientation_pos)):
              failures.append("iOS first-launch logging is initialized after risky UIKit launch calls")

          unsupported_libcxx = (
              "std::expected", "std::print(", "std::println(", "std::mdspan",
              "std::generator", "std::move_only_function", "std::stacktrace",
              "std::ranges::to", "std::views::zip", "std::views::chunk",
              "std::views::slide", "std::views::stride", "std::forward_like",
              "std::to_underlying", "std::byteswap"
          )
          source_suffixes = {".cc", ".cpp", ".cxx", ".h", ".hpp", ".mm"}
          for path in Path("src").rglob("*"):
              if not path.is_file() or path.suffix not in source_suffixes:
                  continue
              text = path.read_text(errors="ignore")
              for token in unsupported_libcxx:
                  if token in text:
                      failures.append(f"{path}: Xcode 15.4/C++20 audit found {token}")

          ios_runtime_apis = {
              "UIButtonConfiguration": (15, 0),
              "UISheetPresentationController": (15, 0),
              "UIContentUnavailableConfiguration": (17, 0),
              "UIHostingConfiguration": (16, 0),
              "UIPasteControl": (16, 0),
              "UICalendarView": (16, 0),
              "UIEditMenuInteraction": (16, 0),
              "UIFindInteraction": (16, 0),
              "setNeedsUpdateOfSupportedInterfaceOrientations": (16, 0),
              "UIWindowSceneGeometryPreferencesIOS": (16, 0),
              "UIUpdateLink": (18, 0),
          }

          def guarded_by_available(lines, index, minimum):
              depth = 0
              active_guards = []
              for raw_line in lines[: index + 1]:
                  line = raw_line.split("//", 1)[0]
                  match = re.search(
                      r"@available\s*\(\s*iOS\s+(\d+)(?:\.(\d+))?", line)
                  opens = line.count("{")
                  closes = line.count("}")
                  if match and "{" in line:
                      version = (int(match.group(1)), int(match.group(2) or 0))
                      active_guards.append((depth, version))
                  depth += opens - closes
                  active_guards = [
                      guard for guard in active_guards if depth > guard[0]
                  ]
              # A guard must require the API's introduction version or a
              # newer runtime. For example, an iOS 15 guard does NOT protect
              # an API introduced in iOS 16, while iOS 16 or 17 guards do.
              return any(version >= minimum for _, version in active_guards)

          # Keep the guard-direction logic honest. These probes model an API
          # introduced in iOS 16 and prevent a future <=/>= regression.
          if guarded_by_available([
              "if (@available(iOS 15.0, *)) {",
              "  API_CALL();",
              "}",
          ], 1, (16, 0)):
              failures.append("availability audit incorrectly accepts an iOS 15 guard for an iOS 16 API")
          if not guarded_by_available([
              "if (@available(iOS 16.0, *)) {",
              "  API_CALL();",
              "}",
          ], 1, (16, 0)):
              failures.append("availability audit rejects an exact iOS 16 guard")
          if not guarded_by_available([
              "if (@available(iOS 17.0, *)) {",
              "  API_CALL();",
              "}",
          ], 1, (16, 0)):
              failures.append("availability audit rejects a stricter iOS 17 guard for an iOS 16 API")

          for path in Path("src/xenia/ui/ios").rglob("*.mm"):
              lines = path.read_text(errors="ignore").splitlines()
              for line_index, line in enumerate(lines):
                  code = line.split("//", 1)[0]
                  for token, minimum in ios_runtime_apis.items():
                      if token not in code:
                          continue
                      if token == "UIUpdateLink":
                          failures.append(
                              f"{path}:{line_index + 1}: {token} is newer than the Xcode 15.4 SDK")
                          continue
                      if not guarded_by_available(lines, line_index, minimum):
                          failures.append(
                              f"{path}:{line_index + 1}: {token} is not inside an iOS {minimum[0]}.{minimum[1]} availability guard")

          if failures:
              raise SystemExit("\n".join(f"COMPAT AUDIT: {failure}" for failure in failures))
          print("Source compatibility audit passed")
          PY

          plutil -lint src/xenia/app/Info_ios.plist
          plutil -lint xenia_ios.entitlements

          converter="third_party/metal-shader-converter/lib_iOS/libmetalirconverter.dylib"
          test -f "$converter"
          file "$converter"
          file "$converter" | grep -q "arm64"
          xcrun vtool -show-build "$converter" | tee scratch/a12-metalirconverter-vtool.txt
          grep -Eq 'platform[[:space:]]+IOS' scratch/a12-metalirconverter-vtool.txt

          python3 - scratch/a12-metalirconverter-vtool.txt 14.7 <<'PY'
          from pathlib import Path
          import re
          import sys

          report = Path(sys.argv[1]).read_text()
          maximum = tuple(int(x) for x in sys.argv[2].split("."))
          maximum += (0,) * (3 - len(maximum))
          versions = re.findall(r"\bminos\s+([0-9]+(?:\.[0-9]+){1,2})", report)
          if not versions:
              raise SystemExit("Metal Shader Converter dylib has no readable LC_BUILD_VERSION minos")
          for raw in versions:
              actual = tuple(int(x) for x in raw.split("."))
              actual += (0,) * (3 - len(actual))
              if actual > maximum:
                  raise SystemExit(
                      f"Metal Shader Converter dylib requires iOS {raw}, above the A12 validation target 14.7")
              print(f"Metal Shader Converter dylib: minOS {raw} <= 14.7")
          PY

      - name: Preflight iOS 14.7 deployment target
        shell: bash
        env:
          CMAKE_OSX_DEPLOYMENT_TARGET: "14.7"
        run: |
          set -euo pipefail
          rm -rf build-ios-xcode
          # iOS configuration requires the native host shader compiler first.
          # Match the ordering used by tools/build_apple_release.sh.
          ./xb build --config=release --target=xenia-shader-cc
          ./xb devenv --target-os=ios --config=release --no-open

          settings="$(xcodebuild \
            -project build-ios-xcode/xenia.xcodeproj \
            -scheme xenia-app \
            -configuration Release \
            -destination generic/platform=iOS \
            -showBuildSettings)"
          printf '%s\n' "$settings" > scratch/a12-build-settings.txt
          deployment_target="$(printf '%s\n' "$settings" | \
            awk -F ' = ' '/^[[:space:]]*IPHONEOS_DEPLOYMENT_TARGET = / { print $2; exit }')"
          echo "Resolved IPHONEOS_DEPLOYMENT_TARGET: $deployment_target"
          test "$deployment_target" = "14.7"

      - name: Compile full iOS 14.7 compatibility surface first
        shell: bash
        env:
          CMAKE_OSX_DEPLOYMENT_TARGET: "14.7"
        run: |
          set -euo pipefail
          # xenia-app pulls in the launcher/startup translation units that a
          # library-only smoke build can miss. The CMake targets also promote
          # Clang's SDK availability diagnostics to errors for first-party iOS
          # and Metal code.
          for target in zlib-ng xenia-base xenia-ui-ios xenia-gpu-metal xenia-ui-metal xenia-app; do
            echo "== compatibility smoke target: $target =="
            xcodebuild \
              -project build-ios-xcode/xenia.xcodeproj \
              -target "$target" \
              -configuration Release \
              -sdk iphoneos \
              IPHONEOS_DEPLOYMENT_TARGET=14.7 \
              CODE_SIGNING_ALLOWED=NO \
              COMPILER_INDEX_STORE_ENABLE=NO \
              OTHER_CFLAGS='$(inherited) -Werror=unguarded-availability' \
              OTHER_CPLUSPLUSFLAGS='$(inherited) -Werror=unguarded-availability' \
              build
          done

          zlib_archive="build-ios-xcode/obj/iOS/Release/libzlib-ng.a"
          test -f "$zlib_archive"
          xcrun nm -u "$zlib_archive" | tee scratch/a12-zlib-ng-undefined.txt
          if grep -Eq '___crc32[bdhw]([[:space:]]|$)' scratch/a12-zlib-ng-undefined.txt; then
            echo "zlib-ng still contains unresolved ARM ACLE CRC intrinsics" >&2
            exit 1
          fi

      - name: Build ad-hoc iOS 14.7 IPA
        shell: bash
        env:
          CMAKE_OSX_DEPLOYMENT_TARGET: "14.7"
        run: |
          set -euo pipefail
          ./tools/build_apple_release.sh \
            --channel preview \
            --stage alpha \
            --ios-min 14.7 \
            --random-ios-bundle-id \
            --skip-macos-arm64 \
            --skip-macos-x86_64
          test -f scratch/artifacts/xenios_ios_iphone_ipad.ipa

      - name: Verify iOS 14.7 ARM64 IPA
        shell: bash
        run: |
          set -euo pipefail
          ipa="scratch/artifacts/xenios_ios_iphone_ipad.ipa"
          rm -rf scratch/a12-ios-verify
          mkdir -p scratch/a12-ios-verify
          ditto -x -k "$ipa" scratch/a12-ios-verify
          app_bundle="$(find scratch/a12-ios-verify/Payload -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app_bundle"
          executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_bundle/Info.plist")"
          test -n "$executable_name"
          main_exe="$app_bundle/$executable_name"
          test -f "$main_exe"

          minimum_os="$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$app_bundle/Info.plist")"
          echo "Info.plist MinimumOSVersion: $minimum_os"
          test "$minimum_os" = "14.7"

          file "$main_exe"
          file "$main_exe" | grep -q "arm64"

          verify_macho_minos() {
            local binary="$1"
            local report actual
            report="$(xcrun vtool -show-build "$binary")"
            printf '%s\n' "$report"
            printf '%s\n' "$report" | grep -Eq 'platform[[:space:]]+IOS'
            actual="$(printf '%s\n' "$report" | awk '/minos[[:space:]]+/ { print $2; exit }')"
            test -n "$actual"
            python3 - "$binary" "$actual" "14.7" <<'PY'
          import sys

          binary, actual, maximum = sys.argv[1:]

          def version_tuple(value):
              parts = value.split(".")
              return tuple(int(part) for part in parts) + (0,) * (3 - len(parts))

          if version_tuple(actual) > version_tuple(maximum):
              raise SystemExit(
                  f"{binary}: deployment target {actual} exceeds iOS {maximum}")
          print(f"{binary}: minOS {actual} <= {maximum}")
          PY
          }

          verify_macho_minos "$main_exe"
          if [ -d "$app_bundle/Frameworks" ]; then
            while IFS= read -r -d '' candidate; do
              if file "$candidate" | grep -q 'Mach-O.*arm64'; then
                verify_macho_minos "$candidate"
              fi
            done < <(find "$app_bundle/Frameworks" -type f -print0)
          fi

          # Catch dyld failures before device testing. Every @rpath dependency
          # referenced by the app or an embedded Mach-O must actually exist in
          # the packaged Frameworks directory.
          verify_rpath_dependencies() {
            local binary="$1"
            while IFS= read -r dependency; do
              dependency="${dependency%% (*}"
              case "$dependency" in
                @rpath/*)
                  local basename="${dependency##*/}"
                  if [ ! -e "$app_bundle/Frameworks/$basename" ]; then
                    echo "$binary: missing packaged dependency $dependency" >&2
                    exit 1
                  fi
                  ;;
              esac
            done < <(otool -L "$binary" | tail -n +2 | sed 's/^[[:space:]]*//')
          }

          verify_rpath_dependencies "$main_exe"
          if [ -d "$app_bundle/Frameworks" ]; then
            while IFS= read -r -d '' candidate; do
              if file "$candidate" | grep -q 'Mach-O'; then
                verify_rpath_dependencies "$candidate"
              fi
            done < <(find "$app_bundle/Frameworks" -type f -print0)
          fi

          plutil -lint "$app_bundle/Info.plist"
          codesign --verify --deep --strict --verbose=2 "$app_bundle"
          codesign -d --entitlements :- "$app_bundle" > scratch/a12-signed-entitlements.plist
          plutil -lint scratch/a12-signed-entitlements.plist
          /usr/libexec/PlistBuddy -c \
            'Print :com.apple.developer.kernel.increased-memory-limit' \
            scratch/a12-signed-entitlements.plist | grep -qx 'true'
          codesign -dv --verbose=2 "$app_bundle"

      - name: Upload validation IPA
        uses: actions/upload-artifact@v4
        with:
          name: a12-ios14_7-validation-ipa
          path: scratch/artifacts/xenios_ios_iphone_ipad.ipa
          if-no-files-found: error
          retention-days: 3
